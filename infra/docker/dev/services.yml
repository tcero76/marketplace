services:
  bff-service:
    working_dir: /app/bff-service
    command: ["air"]
    volumes:
      - ./bff-service:/app/bff-service
      - ./config:/app/config
      - ./postgres:/app/postgres
      - ./clickhouse:/app/clickhouse
      - ./rabbitmq:/app/rabbitmq
      - ./redis:/app/redis
      - ./infra/volumes/uploads:/app/bff-service/uploads
    profiles:
      - bff
    container_name: bff
    stdin_open: true
    tty: true
    environment:
      - DNS_WRITE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dmarketplace
      - DNS_READ=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dmarketplace
      - PORT=3000
      - PORT_EXTERNAL=${PORT_EXTERNAL}
      - HOST_EXTERNAL=${HOST_EXTERNAL}
      - REDIRECT_URL=${PROTOCOL_EXTERNAL}://${HOST_EXTERNAL}/bff/callback
      - HYDRA_ADMIN_URL=http://hydra:4445
      - HYDRA_PUBLIC_URL=http://hydra:4444
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_PORT=9000
      - GOOGLE_OAUTH2_CLIENT_ID=${GOOGLE_OAUTH2_CLIENT_ID}
      - GOOGLE_OAUTH2_CLIENT_SECRET=${GOOGLE_OAUTH2_CLIENT_SECRET}
      - GOOGLE_OAUTH2_REDIRECT_URI=${GOOGLE_OAUTH2_REDIRECT_URI}
      - PROFILE=${PROFILE}
      - REDIS_HOST=${REDIS_HOST}
      - MONITOREO=${MONITOREO}
      - LOG_LEVEL=${LOG_LEVEL}
      - UploadImages=/app/bff-service/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.bff.rule=Host(`${HOST_EXTERNAL}`) && PathPrefix(`/bff`)
      - traefik.http.middlewares.bff-strip.stripprefix.prefixes=/bff
      - traefik.http.routers.bff.middlewares=bff-strip
      - traefik.http.routers.bff.entrypoints=websecure
      - traefik.http.routers.bff.tls=true
      - traefik.http.services.bff.loadbalancer.server.port=3000
      - traefik.http.routers.bff.priority=100
    networks:
      - ${NETWORK_APPLICATION:-application}
    depends_on:
      - db
      - cache
      - broker
  cache-updater-service:
    working_dir: /app
    profiles:
      - back
    container_name: cacheUpdater
    stdin_open: true
    tty: true
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - BROKER=${BROKER}
      - RABBITMQ_CHAT_CACHE_UPDATER_QUEUE=${RABBITMQ_CHAT_CACHE_UPDATER_QUEUE}
    networks:
      - ${NETWORK_APPLICATION:-application}
    volumes:
      - ./cache-updater:/app
    depends_on:
      - cache
      - broker
  broker-email-service:
    working_dir: /broker-email-service
    profiles:
      - back
    container_name: brokerEmail
    command: ["air"]
    stdin_open: true
    tty: true
    environment:
      - EVT_USER_REGISTERED_EMAIL_QUEUE=${EVT_USER_REGISTERED_EMAIL_QUEUE}
      - BROKER=${BROKER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - HOST=broker
      - PORT=5672
    networks:
      - ${NETWORK_APPLICATION:-application}
    volumes:
      - ./broker-email-service:/broker-email-service
      - ./rabbitmq:/rabbitmq
      - ./config:/config
      - ./postgres:/postgres
    depends_on:
      broker:
        condition: service_healthy
  db-updater-service:
    working_dir: /app  
    profiles:
      - back
    container_name: dbUpdater
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dmarketplace
      - BROKER=${BROKER}
      - CMD_CHAT_MESSAGE_PERSISTENCE_QUEUE=${CMD_CHAT_MESSAGE_PERSISTENCE_QUEUE}
    networks:
      - ${NETWORK_APPLICATION:-application}
    volumes:
      - ./db-updater:/app
    depends_on:
      - db
      - broker
  db-broker-service:
    working_dir: /app  
    profiles:
      - back
    container_name: DbBroker
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dmarketplace
      - EVT_USER_REGISTERED_EMAIL_QUEUE=${EVT_USER_REGISTERED_EMAIL_QUEUE}
      - EVT_USER_REGISTERED_EXCHANGE=${EVT_USER_REGISTERED_EXCHANGE}
      - BROKER=${BROKER}
    networks:
      - ${NETWORK_APPLICATION:-application}
    volumes:
      - ./db-broker-service:/app
      - ./postgres:/postgres
    depends_on:
      - db
      - broker
  ws-service:
    container_name: ws
    profiles:
      - ws
    tty: true
    stdin_open: true
    environment:
      - MIX_ENV=dev
      - CMD_CHAT_MESSAGE_DELIVERY_QUEUE=${CMD_CHAT_MESSAGE_DELIVERY_QUEUE}
      - CMD_CHAT_MESSAGE_SEND_EXCHANGE=${CMD_CHAT_MESSAGE_SEND_EXCHANGE}
      - RABBITMQ_HOST=broker
      - HYDRA_JWKS_URL=http://hydra:4444/.well-known/jwks.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.ws.rule=Host(`${HOST_EXTERNAL}`) && PathPrefix(`/api`)
      - traefik.http.middlewares.ws-strip.stripprefix.prefixes=/api
      - traefik.http.routers.ws.middlewares=ws-strip
      - traefik.http.routers.ws.entrypoints=websecure
      - traefik.http.routers.ws.tls=true
      - traefik.http.services.ws.loadbalancer.server.port=4000
      - traefik.http.routers.ws.priority=100
    volumes:
      - ./ws-service:/ws-service
    depends_on:
      - broker
    networks:
      - ${NETWORK_APPLICATION:-application}
  front:
    container_name: front
    profiles:
      - front
    working_dir: /app
    command: ["npm", "run", "dev"]
    tty: true
    stdin_open: true
    environment:
      - NEXT_PUBLIC_HOST=${PROTOCOL_EXTERNAL}://${HOST_EXTERNAL}
      - NEXT_PUBLIC_WS=${PROTOCOL_WS_EXTERNAL}://${HOST_EXTERNAL}
      - NEXT_PUBLIC_CLIENT_ID=${CLIENT_ID}
      - NEXT_PUBLIC_MOCK=${VITE_MOCK}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH2_CLIENT_ID}
    ports:
     - 3000:3000
    volumes:
      - ./front:/app
    networks:
      - ${NETWORK_APPLICATION:-application}
    labels:
      - traefik.enable=true
      - traefik.http.routers.front.rule=Host(`${HOST_EXTERNAL}`)
      - traefik.http.routers.front.entrypoints=websecure
      # - traefik.http.routers.front.tls.certresolver=le
      - traefik.http.routers.front.tls=true
      - traefik.http.middlewares.front-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.front-headers.headers.customrequestheaders.X-Forwarded-Host=`${HOST_EXTERNAL}`
      - traefik.http.routers.front.middlewares=front-headers

      - traefik.http.services.front.loadbalancer.server.port=3000
      - traefik.http.routers.front.priority=10
  solana-service:
    profiles:
      - solana
    working_dir: /app/
    restart: always
    entrypoint: [ "air"]
    container_name: solana-service
    tty: true
    stdin_open: true
    environment:
      - PROGRAMID=${PROGRAMID}
      - BROKER=${BROKER}
      - EVT_PAYMENT_COMPLETED_EXCHANGE=${EVT_PAYMENT_COMPLETED_EXCHANGE}
    volumes:
      - ../../solana-service:/app
    networks:
      - ${NETWORK_APPLICATION:-application}
  scrap-service:
    working_dir: /app/scrap-service/
    profiles:
      - scrap
    command: ["/entrypoint.sh"]
    container_name: scrap-service
    tty: true
    stdin_open: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - BROKER=${BROKER}
      - PORT=8000
      - TOTAL_POSTS=${TOTAL_POSTS}
      - USERNAME_INSTA=${USERNAME_INSTA}
      - PASSWORD_INSTA=${PASSWORD_INSTA}
      - CMD_SCRAPY_START_QUEUE=${CMD_SCRAPY_START_QUEUE}
      - CMD_SCRAPY_START_EXCHANGE=${CMD_SCRAPY_START_EXCHANGE}
      - PROFILE=${PROFILE}
    volumes:
      - ./scrap-service:/app/scrap-service
      - ./rabbitmq:/app/rabbitmq
    depends_on:
      - broker
    networks:
      - ${NETWORK_APPLICATION:-application}
  beat-service:
    working_dir: /app/beat-service/
    profiles:
      - scrap
    container_name: beat-service
    tty: true
    stdin_open: true
    environment:
      - BROKER=${BROKER}
      - CRON_HOUR=${CRON_HOUR}
      - CRON_MINUTE=${CRON_MINUTE}
      - CMD_RECOMMENDER_CALCULATE_QUEUE=${CMD_RECOMMENDER_CALCULATE_QUEUE}
      - CMD_RECOMMENDER_CALCULATE_EXCHANGE=${CMD_RECOMMENDER_CALCULATE_EXCHANGE}
      - CMD_SCRAPY_START_QUEUE=${CMD_SCRAPY_START_QUEUE}
      - CMD_SCRAPY_START_EXCHANGE=${CMD_SCRAPY_START_EXCHANGE}
    volumes:
      - ./beat-service:/app/beat-service
      - ./rabbitmq:/app/rabbitmq
    depends_on:
      - broker
      - scrap-service
    networks:
      - ${NETWORK_APPLICATION:-application}
  recomender-service:
    working_dir: /app/recomender-service/
    profiles:
      - scrap
    command: [ "celery", "-A", "main", "worker","--loglevel=debug" ]
    container_name: recomender-service
    tty: true
    stdin_open: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - BROKER=${BROKER}
      - PORT=8000
      - TOTAL_POSTS=${TOTAL_POSTS}
      - CACHE=redis://cache:6379/0
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CMD_RECOMMENDER_CALCULATE_QUEUE=${CMD_RECOMMENDER_CALCULATE_QUEUE}
      - CMD_RECOMMENDER_CALCULATE_EXCHANGE=${CMD_RECOMMENDER_CALCULATE_EXCHANGE}
      - CMD_SCRAPY_START_QUEUE=${CMD_SCRAPY_START_QUEUE}
      - CMD_SCRAPY_START_EXCHANGE=${CMD_SCRAPY_START_EXCHANGE}
    volumes:
      - ./recomender-service:/app/recomender-service
      - ./rabbitmq:/app/rabbitmq
    depends_on:
      - broker
      - db
    networks:
      - ${NETWORK_APPLICATION:-application}
  mediamtx-service:
    container_name: mediamtx-service
    profiles:
      - media
    ports:
      - 3001:3001
    volumes:
      - ./mediamtx-service:/app
      - ./config:/app/config
      - ./redis:/app/redis
      - ./postgres:/app/postgres
    environment:
      - DNS_WRITE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dmarketplace
      - DNS_READ=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dmarketplace
      - HYDRA_PUBLIC_URL=${PROTOCOL_EXTERNAL}://hydra:4444
      - TIME_SEC_WAIT_RTMP_CONECTION=60
      - PORT=3001
      - REDIS_HOST=${REDIS_HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - MONITOREO=${MONITOREO}
    labels:
    - traefik.enable=true
    - traefik.http.routers.control-plane.rule=Host(`${HOST_EXTERNAL}`) && PathPrefix(`/control`)
    - traefik.http.routers.control-plane.entrypoints=websecure
    - traefik.http.routers.control-plane.tls=true
    - traefik.http.routers.control-plane.priority=100
    - traefik.http.routers.control-plane.middlewares=control-plane-strip
    - traefik.http.middlewares.control-plane-strip.stripprefix.prefixes=/control
    - traefik.http.services.control-plane.loadbalancer.server.port=3001
    networks:
      - ${NETWORK_APPLICATION:-application}

