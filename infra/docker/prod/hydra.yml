services:
  hydra:
    image: tcero76/hydra:v0.0.0
    ports:
      - "4444:4444"
      - "4445:4445"
    command: serve all --dev
    environment:
      - DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable&options=-c%20search_path%3Dhydra
      - URLS_SELF_ISSUER=http://${HOST_EXTERNAL}:${PORT_EXTERNAL}/hydra
      - URLS_LOGIN=http://${HOST_EXTERNAL}:${PORT_EXTERNAL}/login 
      - URLS_CONSENT=http://${HOST_EXTERNAL}:${PORT_EXTERNAL}/bff/consent
      - SECRETS_SYSTEM=some_secret_key_system
      - TTL_ACCESS_TOKEN=1h
      - TTL_REFRESH_TOKEN=720h
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_PASSWORD_FILE=/run/secrets/patroni_admin_password
    secrets:
      - patroni_admin_password
    networks:
      - ${NETWORK_APPLICATION:-application}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-worker-0
      restart_policy:
        condition: on-failure