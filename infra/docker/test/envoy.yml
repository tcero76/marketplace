services:
  envoy:
    image: tcero76/envoy:0.0.0
    build:
      dockerfile: Dockerfile
      context: ../../envoy/
    container_name: envoy
    profiles:
      - front
    tty: true
    stdin_open: true
    environment:
     - ENVOY_HOST=0.0.0.0
     - ENVOY_PORT=$PORT_EXTERNAL
    ports:
      - $PORT_EXTERNAL:$PORT_EXTERNAL
    networks:
      - ${NETWORK_APPLICATION}