  # jobs
  TOTAL_POSTS: 5
  CRON_HOUR: 23
  CRON_MINUTE: 12
  USERNAME_INSTA: arodnazs@hotmail.com
  #colas
  BROKER: amqp://guest:guest@broker:5672
  RECOMENDER_QUEUE: recomender_queue
  SCRAPY_QUEUE: scrapy_queue
  RABBITMQ_QUEUE: chat_event_queue
