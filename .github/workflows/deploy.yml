  HOST_EXTERNAL: localhost
  HOST_URL: http://${HOST_EXTERNAL}:${PORT_EXTERNAL}
  HOST_WS: ws://${HOST_EXTERNAL}:${PORT_EXTERNAL}
  NETWORK_APPLICATION: application
  TF_VAR_overlay_network: application
  TAG: V0.0.0
  #secrets
  # CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD}}
  # POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
  # POSTGRES_CDC_PASSWORD: ${{ secrets.POSTGRES_CDC_PASSWORD}}
