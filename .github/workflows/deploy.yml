  #OAuth google
  GOOGLE_OAUTH2_REDIRECT_URI: http://localhost:8080/bff/callback
  # email
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 587
  SMTP_USER: leonardo.lastra@gmail.com
  # docker
  DOCKER_USERNAME: tcero76
  MANAGER_IP: 134.209.32.181
jobs:
  terraform:
    name: Terraform Apply
    if:  false
    runs-on: ubuntu-latest
    outputs:
      manager_ip: ${{ steps.get_ip.outputs.manager_ip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}

      - name: Get Swarm Manager IP
        id: get_ip
        run: echo "manager_ip=$(terraform -chdir=terraform output -raw manager_public_ip)" >> $GITHUB_OUTPUT

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mydockerhubuser/api
          tags: |
            type=ref,event=tag

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Generate flattened Compose file
        run: docker compose config > docker-compose.generated.yml

      - name: Build and push images
        run: |
          docker compose -f docker-compose.generated.yml build
          docker compose -f docker-compose.generated.yml push

  swarm:
    name: Update Docker Swarm Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Crear archivo .env
        run: |
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "bash -c 'cat > /root/.env <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_HOST=$POSTGRES_HOST
          POSTGRES_PORT=$POSTGRES_PORT
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_VOLUME=$POSTGRES_VOLUME
          CLICKHOUSE_VOLUME=$CLICKHOUSE_VOLUME
          CLICKHOUSE_USER=$CLICKHOUSE_USER
          RABBITMQ_VERSION=$RABBITMQ_VERSION
          RABBITMQ_VOLUME=$RABBITMQ_VOLUME
          HYDRA_VERSION=$HYDRA_VERSION
          REDIS_VERSION=$REDIS_VERSION
          CLICKHOUSE_VERSION=$CLICKHOUSE_VERSION
          HOUSEPLANT_VERSION=${HOUSEPLANT_VERSION}
          HOST_EXTERNAL=$MANAGER_IP
          PORT_EXTERNAL=$PORT_EXTERNAL
          NETWORK_APPLICATION=$NETWORK_APPLICATION
          EOF'"

      - name: Crear secrets en Docker Swarm
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.POSTGRES_PASSWORD }}' | docker secret create postgres_password - \
              && echo '✅ Secret postgres_password creado' \
              || echo 'ℹ️ Secret postgres_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.CLICKHOUSE_PASSWORD }}' | docker secret create clickhouse_password - \
              && echo '✅ Secret clickhouse_password creado' \
              || echo 'ℹ️ Secret clickhouse_password ya existe, continuando...'
          "

  # PATRONI_ADMIN_PASSWORD: admin
  # PATRONI_SUPERUSER_PASSWORD: postgres
  # PATRONI_RESTAPI_PASSWORD: admin




        shell: bash

      - name: Copy docker-compose.yml to manager
        run: |
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            mkdir -p docker
          "
          scp -o StrictHostKeyChecking=no infra/docker/imagenes.yml \
            root@$MANAGER_IP:/root/docker/imagenes.yml
          scp -o StrictHostKeyChecking=no infra/docker/prod/* \
            root@$MANAGER_IP:/root/docker/

      - name: Deploy stack on Swarm manager
        run: ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "/root/deploy_stack.sh"




