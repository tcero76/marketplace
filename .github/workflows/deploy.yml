name: Deploy Infrastructure & Services

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  PROFILE: prod
  # Application
  PORT_EXTERNAL: 80
  NETWORK_APPLICATION: application
  TF_VAR_overlay_network: application
  TAG: v0.0.0
  COMPOSE_PROFILE: bff
  COMPOSE_FILE: infra/docker/imagenes.yml:infra/docker/prod/services.yml:infra/docker/prod/monitoring.yml:infra/docker/prod/postgres.yml:infra/docker/prod/clickhouse.yml:infra/docker/prod/hydra.yml:infra/docker/prod/envoy.yml:infra/docker/prod/rabbitmq.yml:infra/docker/prod/mediamtx.yml:infra/docker/prod/redis.yml:infra/docker/prod/elastic.yml:infra/docker/prod/common.yml

  #secrets
  # CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD}}
  # POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD}}
  # POSTGRES_CDC_PASSWORD: ${{ secrets.POSTGRES_CDC_PASSWORD}}
  CLIENT_ID: 657d0bb0-2314-4c8b-b649-1525af797d72
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET}}
  GOOGLE_OAUTH2_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH2_CLIENT_ID}}
  GOOGLE_OAUTH2_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET}}
  # SMTP_PASS: ${{ secrets.SMTP_PASS}}
  # DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD}}
  # DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN}}
  # DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET}}
  # DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY}}
  # PASSWORD_INSTA: ${{ secrets.PASSWORD_INSTA}}
  # PROGRAMID: ${{ secrets.PROGRAMID}}
  PATRONI_ADMIN_HOST: haproxy
  PATRONI_ADMIN_DB: marketplace
  PATRONI_ADMIN_PORT: 5000
  PATRONI_RESTAPI_USERNAME: admin
  PATRONI_SUPERUSER_USERNAME: tcero
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_admin_OPTIONS: createdb,createrole

  # Versions
  HYDRA_VERSION: v2.3.0
  OATHKEEPER_VERSION: v0.40.9
  NODE_VERSION: 24.0.1
  RABBITMQ_VERSION: 4.0-management
  MEDIAMTX_VERSION: 1.12.2
  REDIS_VERSION: 8.0.0
  ELASTICSEARCH_VERSION: 8.12.0
  KIBANA_VERSION: 8.12.0
  LOGSTASH_VERSION: 8.12.0
  CLICKHOUSE_VERSION: 25.10.1
  TIMESCALEDB_VERSION: 2.20.1-pg17
  PATRONI_TIMESCALEDB_VERSION: 17
  HOUSEPLANT_VERSION: 0.0.0
  # Volumes
  CLICKHOUSE_VOLUME: /mnt/data/clickhouse
  POSTGRES_VOLUME: /mnt/data/timescaleDB
  RABBITMQ_VOLUME: /mnt/data/rabbitmq
  REDIS_VOLUME: /mnt/data/redis
  GRAFANA_VOLUME: /mnt/data/grafana
  PROMETHEUS_VOLUME: /mnt/data/prometheus
  MEDIAMTX_VOLUME: /mnt/data/mediamtx
  # jobs
  TOTAL_POSTS: 5
  CRON_HOUR: 23
  CRON_MINUTE: 12
  USERNAME_INSTA: arodnazs@hotmail.com
  #colas
  BROKER: amqp://guest:guest@broker:5672
  RECOMENDER_QUEUE: recomender_queue
  EVT_PAYMENT_COMPLETED_EXCHANGE: evt_payment_completed_exchange
  EVT_PAYMENT_PERSISTENCE_QUEUE: evt_payment_persistence_queue
  CMD_CHAT_MESSAGE_SEND_EXCHANGE: cmd_chat_message_send_exchange
  CMD_CHAT_MESSAGE_DELIVERY_QUEUE: cmd_chat_message_delivery_queue
  RABBITMQ_CHAT_CACHE_UPDATER_QUEUE: chat_cache_updater_queue
  CMD_CHAT_MESSAGE_PERSISTENCE_QUEUE: cmd_chat_message_persistence_queue
  EVT_USER_REGISTERED_EMAIL_QUEUE: evt_user_registered_email_queue
  EVT_USER_REGISTERED_EXCHANGE: evt_user_registered_exchange
  CMD_RECOMMENDER_CALCULATE_QUEUE: cmd_recommender_calculate_queue
  CMD_RECOMMENDER_CALCULATE_EXCHANGE: cmd_recommender_calculate_exchange
  CMD_SCRAPY_START_QUEUE: cmd_scrapy_start_queue
  CMD_SCRAPY_START_EXCHANGE: cmd_scrapy_start_exchange
  # redis
  REDIS_HOST: cache
  #clickhouse
  CLICKHOUSE_USER: tcero
  # postgres
  POSTGRES_USER: tcero
  POSTGRES_DB: marketplace
  POSTGRES_PORT: 5000
  POSTGRES_HOST: haproxy
  # patroni

  #OAuth google
  GOOGLE_OAUTH2_REDIRECT_URI: http://localhost:8080/bff/callback
  # email
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 587
  SMTP_USER: leonardo.lastra@gmail.com
  # docker
  DOCKER_USERNAME: tcero76
  MANAGER_IP: 142.93.189.253
jobs:
  terraform:
    name: Terraform Apply
    if:  false
    runs-on: ubuntu-22.04
    outputs:
      manager_ip: ${{ steps.get_ip.outputs.manager_ip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}

      - name: Get Swarm Manager IP
        id: get_ip
        run: echo "manager_ip=$(terraform -chdir=terraform output -raw manager_public_ip)" >> $GITHUB_OUTPUT

  detect_changed_services:
    runs-on: ubuntu-22.04
    outputs:
      front: ${{ steps.detect.outputs.front }}
      bff: ${{ steps.detect.outputs.bff }}
      scrap: ${{ steps.detect.outputs.scrap }}
      flyway: ${{ steps.detect.outputs.flyway }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          # Inicializar flags
          echo "front=false" >> $GITHUB_OUTPUT
          echo "bff=false" >> $GITHUB_OUTPUT
          # Obtener lista de archivos modificados
          CHANGED=$(git diff --name-only HEAD^ HEAD)

          echo "$CHANGED" | grep "^front/" && echo "front=true" >> $GITHUB_OUTPUT
          if echo "$CHANGED" | grep -qE "^(bff-service/|postgres/|clickhouse/|redis/|rabbitmq/|config/)/"; then
            echo "bff=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE "^(scrap-service/|rabbitmq/)/"; then
            echo "scrap=true" >> $GITHUB_OUTPUT
          fi
          echo "$CHANGED" | grep "^flyway/" && echo "flyway=true" >> $GITHUB_OUTPUT
          echo "Step finalizado"
 
  build_services:
    permissions:
      contents: write
    needs: detect_changed_services
    if: >
      needs.detect_changed_services.outputs.front == 'true' ||
      needs.detect_changed_services.outputs.bff == 'true' ||
      needs.detect_changed_services.outputs.scrap == 'true' ||
      needs.detect_changed_services.outputs.flyway == 'true'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service:
          - name: front
            path: front
            image: tcero76/front
            build_target: front
            flag: front
          - name: bff-service
            path: bff-service
            image: tcero76/bff-service
            build_target: bff-service
            flag: bff
          - name: scrap-service
            path: scrap-service
            image: tcero76/scrap-service
            build_target: scrap-service
            flag: scrap
          - name: flyway
            path: flyway
            image: tcero76/flyway
            build_target: flyway
            flag: flyway
      max-parallel: 1
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Saltarse el servicio si no cambió
        if: ${{ needs.detect_changed_services.outputs[ matrix.service.flag ] != 'true' }}
        run: |
          echo "El servicio ${matrix.service.name} no cambió. Saltando."
        continue-on-error: false

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Update tag in manifests
        run: |
          sed -i "s|image: ${{ matrix.service.image }}:.*|image: ${{ matrix.service.image }}:${{ github.sha }}|g" infra/docker/imagenes.yml

      - name: Build image
        run: |
          export COMPOSE_FILE=infra/docker/build.yml:infra/docker/imagenes.yml
          export HOST_EXTERNAL=$MANAGER_IP
          
          docker compose \
            --project-directory ${PWD} \
            --project-name marketplace \
            build \
            ${{ matrix.service.build_target }} \
            --push

      - name: Commit new tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "Update image to ${{ github.sha }}"
          git push

  environment:
    name: Update environment variables on Manager
    runs-on: ubuntu-22.04
    needs: [build_services]
    if: ${{ always() && contains(needs.build_services.result, 'success') }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Crear archivo .env
        run: |
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "bash -c 'cat > /root/.env <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_HOST=$POSTGRES_HOST
          POSTGRES_PORT=$POSTGRES_PORT
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_VOLUME=$POSTGRES_VOLUME
          CLICKHOUSE_VOLUME=$CLICKHOUSE_VOLUME
          CLICKHOUSE_USER=$CLICKHOUSE_USER
          RABBITMQ_VERSION=$RABBITMQ_VERSION
          RABBITMQ_VOLUME=$RABBITMQ_VOLUME
          HYDRA_VERSION=$HYDRA_VERSION
          REDIS_VERSION=$REDIS_VERSION
          CLICKHOUSE_VERSION=$CLICKHOUSE_VERSION
          HOUSEPLANT_VERSION=${HOUSEPLANT_VERSION}
          HOST_EXTERNAL=$MANAGER_IP
          PORT_EXTERNAL=$PORT_EXTERNAL
          NETWORK_APPLICATION=$NETWORK_APPLICATION
          BROKER=${BROKER}
          RABBITMQ_QUEUE=${RABBITMQ_QUEUE}
          EVT_PAYMENT_COMPLETED_EXCHANGE=${EVT_PAYMENT_COMPLETED_EXCHANGE}
          EVT_PAYMENT_PERSISTENCE_QUEUE=${EVT_PAYMENT_PERSISTENCE_QUEUE}
          EVT_USER_REGISTERED_EXCHANGE=${EVT_USER_REGISTERED_EXCHANGE}
          EVT_USER_REGISTERED_EMAIL_QUEUE=${EVT_USER_REGISTERED_EMAIL_QUEUE}
          CMD_CHAT_MESSAGE_SEND_EXCHANGE=${CMD_CHAT_MESSAGE_SEND_EXCHANGE}
          CMD_CHAT_MESSAGE_DELIVERY_QUEUE=${CMD_CHAT_MESSAGE_DELIVERY_QUEUE}
          CMD_CHAT_MESSAGE_PERSISTENCE_QUEUE=${CMD_CHAT_MESSAGE_PERSISTENCE_QUEUE}
          RABBITMQ_CHAT_CACHE_UPDATER_QUEUE=${CMD_CHAT_CACHE_UPDATER_QUEUE}
          CMD_RECOMMENDER_CALCULATE_QUEUE=${CMD_RECOMMENDER_CALCULATE_QUEUE}
          CMD_RECOMMENDER_CALCULATE_EXCHANGE=${CMD_RECOMMENDER_CALCULATE_EXCHANGE}
          CMD_SCRAPY_START_QUEUE=${CMD_SCRAPY_START_QUEUE}
          CMD_SCRAPY_START_EXCHANGE=${CMD_SCRAPY_START_EXCHANGE}
          PATRONI_ADMIN_HOST=${PATRONI_ADMIN_HOST}
          PATRONI_ADMIN_DB=${PATRONI_ADMIN_DB}
          PATRONI_ADMIN_PORT=${PATRONI_ADMIN_PORT}
          PATRONI_RESTAPI_USERNAME=${PATRONI_RESTAPI_USERNAME}
          PATRONI_REPLICATION_USERNAME=${PATRONI_REPLICATION_USERNAME}
          PATRONI_admin_OPTIONS=${PATRONI_admin_OPTIONS}
          PATRONI_admin_PASSWORD_FILE=/run/secrets/patroni_admin_password
          PATRONI_SUPERUSER_USERNAME=${PATRONI_SUPERUSER_USERNAME}
          PATRONI_SUPERUSER_PASSWORD_FILE=/run/secrets/patroni_admin_password
          PATRONI_RESTAPI_PASSWORD_FILE=/run/secrets/patroni_restapi_password
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_HOST=${POSTGRES_HOST}
          CLIENT_ID=${CLIENT_ID}
          CLIENT_SECRET=${CLIENT_SECRET}
          GOOGLE_OAUTH2_CLIENT_ID=${GOOGLE_OAUTH2_CLIENT_ID}
          GOOGLE_OAUTH2_CLIENT_SECRET=${GOOGLE_OAUTH2_CLIENT_SECRET}
          TAG=${TAG}
          CRON_HOUR=${CRON_HOUR}
          CRON_MINUTE=${CRON_MINUTE}
          CMD_SCRAPY_START_QUEUE=${CMD_SCRAPY_START_QUEUE}
          CMD_SCRAPY_START_EXCHANGE=${CMD_SCRAPY_START_EXCHANGE}
          TOTAL_POSTS=${TOTAL_POSTS}
          USERNAME_INSTA=${USERNAME_INSTA}
          REDIS_HOST=${REDIS_HOST}
          REDIS_VOLUME=${REDIS_VOLUME}
          EOF'"

      - name: Crear secrets en Docker Swarm
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.POSTGRES_PASSWORD }}' | docker secret create postgres_password - \
              && echo '✅ Secret postgres_password creado' \
              || echo 'ℹ️ Secret postgres_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.CLICKHOUSE_PASSWORD }}' | docker secret create clickhouse_password - \
              && echo '✅ Secret clickhouse_password creado' \
              || echo 'ℹ️ Secret clickhouse_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.PATRONI_ADMIN_PASSWORD }}' | docker secret create patroni_admin_password - \
              && echo '✅ Secret patroni_admin_password creado' \
              || echo 'ℹ️ Secret patroni_admin_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.PATRONI_SUPERUSER_PASSWORD }}' | docker secret create patroni_superuser_password - \
              && echo '✅ Secret patroni_superuser_password creado' \
              || echo 'ℹ️ Secret patroni_superuser_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.PATRONI_RESTAPI_PASSWORD }}' | docker secret create patroni_restapi_password - \
              && echo '✅ Secret patroni_restapi_password creado' \
              || echo 'ℹ️ Secret patroni_restapi_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.PATRONI_REPLICATION_PASSWORD }}' | docker secret create patroni_replication_password - \
              && echo '✅ Secret patroni_replication_password creado' \
              || echo 'ℹ️ Secret patroni_replication_password ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.CLIENT_SECRET }}' | docker secret create client_secret - \
              && echo '✅ Secret client_secret creado' \
              || echo 'ℹ️ Secret client_secret ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}' | docker secret create google_oauth2_client_secret - \
              && echo '✅ Secret google_oauth2_client_secret creado' \
              || echo 'ℹ️ Secret google_oauth2_client_secret ya existe, continuando...'
          "
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            echo '${{ secrets.PASSWORD_INSTA }}' | docker secret create password_insta - \
              && echo '✅ Secret password_insta creado' \
              || echo 'ℹ️ Secret password_insta ya existe, continuando...'
          "
        shell: bash

      - name: Copy docker-compose.yml to manager
        run: |
          ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            mkdir -p docker
          "
          scp -o StrictHostKeyChecking=no infra/docker/imagenes.yml \
            root@$MANAGER_IP:/root/docker/imagenes.yml
          scp -o StrictHostKeyChecking=no infra/docker/prod/* \
            root@$MANAGER_IP:/root/docker/

      - name: deploy
        run: ssh -o StrictHostKeyChecking=no root@$MANAGER_IP "
            /root/deploy_stack.sh
          " 


